<!DOCTYPE html>
<html lang="en">
<head>

<script async src="https://www.googletagmanager.com/gtag/js?id=G-MKJ38MNNCE"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>serhat yuecel studio</title>

    <style>
        @font-face {
            font-family: 'Apple Garamond';
            src: url('SYS/fonts/AppleGaramond.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --primary-color: #333;
            --background-color: #ffffff;
            --light-grey: #e0e0e0;
            --black-overlay: rgba(0, 0, 0, 0.7);
            --nav-active: #111111;
            --nav-inactive: #b0b0b0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--background-color);
            color: var(--primary-color);
            margin: 0;
            padding: 0rem 1rem;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ─── HEADER ─────────────────────────────────────────────── */
        header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0rem 1rem;
            margin-bottom: 0;
            position: relative;
        }

        .header-logo-wrap {
            display: flex;
            justify-content: center;
        }

        .logo-image {
            height: 80px;
            width: auto;
            object-fit: contain;
            display: block;
            transition: opacity 0.3s ease;
        }

        .header-logo-wrap a:hover .logo-image {
            opacity: 0.7;
        }

        .nav-links {
            position: absolute;
            left: 1rem;
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .header-tiktok {
            position: absolute;
            right: 1rem;
            display: flex;
            align-items: center;
        }

        .nav-section {
            text-decoration: none;
            cursor: pointer;
            transition: color 0.2s ease;
            background: none;
            border: none;
            padding: 0;
        }

        .nav-label {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            white-space: nowrap;
            transition: color 0.25s ease;
        }

        .nav-section.active .nav-label { color: var(--nav-active); }
        .nav-section.inactive .nav-label { color: var(--nav-inactive); }

        /* ─── GALLERY ─────────────────────────────────────────────── */
        .gallery-container {
            max-width: 1200px;
            margin: 3rem auto 0;
            padding: 0 1rem;
            flex-grow: 1;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .artwork-item {
            position: relative;
            background: transparent;
            overflow: hidden;
            box-shadow: none;
            transition: transform 0.3s ease;
            text-align: center;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            aspect-ratio: 1 / 1;
            box-sizing: border-box;
            padding: 12px;
            justify-content: center;
        }

        .artwork-item:hover { transform: translateY(-5px); }

        .artwork-image {
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
        }

        .artwork-title { display: none; }

        /* ─── DETAIL VIEW ─────────────────────────────────────────── */
        .artwork-detail {
            display: none;
            padding: 0;
            background-color: transparent;
            max-width: 640px;
            margin: 0 auto;
        }

        .detail-image {
            width: 100%;
            height: auto;
            max-width: 560px;
            max-height: 60vh;
            object-fit: contain;
            margin: 0 auto;
            display: block;
            cursor: pointer;
        }

        .detail-image.large-detail { max-width: 1000px; max-height: 85vh; }
        .detail-image.itaped-adjust { margin-top: -40px; }

        .detail-info {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.5rem;
            font-weight: 300;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
            margin-top: 0.25rem;
        }

        .detail-info h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-top: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .detail-info strong { font-weight: 600; }

        /* ─── FULLSCREEN ──────────────────────────────────────────── */
        .fullscreen-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
        }

        .fullscreen-image {
            max-width: 90%;
            max-height: 90vh;
            object-fit: contain;
            cursor: pointer;
        }

        .close-button {
            position: absolute;
            top: 20px; right: 30px;
            font-size: 2rem;
            color: #fff;
            cursor: pointer;
        }

        /* ─── SERIES TITLE ────────────────────────────────────────── */
        .series-title {
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--nav-active);
            letter-spacing: 0.04em;
            margin: 0 0 1.5rem 0;
        }

        .tiktok-link-image {
            width: 30px;
            height: auto;
            object-fit: contain;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .tiktok-link-image:hover { opacity: 0.9; transform: scale(1.05); }

        /* ─── PHOTO LIGHTBOX ──────────────────────────────────────── */
        .photo-lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.93);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .photo-lightbox.open { display: flex; }

        .lightbox-img {
            max-width: 85vw;
            max-height: 85vh;
            object-fit: contain;
            user-select: none;
            pointer-events: none;
        }

        .lightbox-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #fff;
            font-size: 2.5rem;
            cursor: pointer;
            padding: 1rem;
            opacity: 0.6;
            transition: opacity 0.2s ease;
            line-height: 1;
        }

        .lightbox-arrow:hover { opacity: 1; }
        .lightbox-arrow.prev { left: 1rem; }
        .lightbox-arrow.next { right: 1rem; }

        .lightbox-close {
            position: absolute;
            top: 1.2rem; right: 1.5rem;
            font-size: 2rem;
            color: #fff;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.2s ease;
        }
        .lightbox-close:hover { opacity: 1; }

        .lightbox-counter {
            position: absolute;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 0.8rem;
            opacity: 0.5;
            letter-spacing: 0.1em;
        }

        /* ─── RESPONSIVE ──────────────────────────────────────────── */
        @media (max-width: 768px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
            .detail-info {
                grid-template-columns: 1fr;
            }
            /* Stack header vertically on mobile */
            header {
                flex-direction: column;
                align-items: center;
                padding-top: 0.75rem;
                padding-bottom: 0.75rem;
            }
            .header-logo-wrap {
                order: 1;
            }
            .nav-links {
                order: 2;
                position: static;
                display: flex;
                flex-direction: row;
                justify-content: center;
                gap: 1.5rem;
                margin-top: 0.5rem;
            }
            .header-tiktok {
                order: 3;
                position: static;
                margin-top: 0.5rem;
            }
        }

        @media (min-width: 1024px) {
            .gallery { grid-template-columns: repeat(4, 1fr); }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-logo-wrap">
            <a href="#" onclick="showGallery(); return false;">
                <img src="https://imgur.com/zslzw0O.jpg"
                     alt="Serhat Yuecel Logo"
                     class="logo-image"
                     onerror="this.onerror=null;this.src='https://placehold.co/80x80/f0f0f0/333333?text=SY'">
            </a>
        </div>

        <nav class="nav-links">
            <div class="nav-section active" id="nav-art" onclick="switchSection('art')">
                <span class="nav-label">Traditional Art</span>
            </div>
            <div class="nav-section inactive" id="nav-photo" onclick="switchSection('photo')">
                <span class="nav-label">Photography</span>
            </div>
        </nav>

        <div class="header-tiktok">
            <a href="https://www.tiktok.com/@serhatyuecel?is_from_webapp=1&sender_device=pc" target="_blank" rel="noopener noreferrer">
                <img src="https://i.imgur.com/F4027rQ.png" alt="TikTok" class="tiktok-link-image"
                     onerror="this.onerror=null;this.src='https://placehold.co/30x9/e0e0e0/333333?text=TikTok'">
            </a>
        </div>
    </header>

    <main class="gallery-container" id="section-art">
        <ul id="main-gallery" class="gallery"></ul>
        <div id="artwork-detail" class="artwork-detail"></div>
    </main>

    <main class="gallery-container" id="section-photo" style="display:none;">
        <div id="photo-gallery-wrapper"></div>
        <div id="photo-detail" class="artwork-detail"></div>
    </main>

    <div id="fullscreen-overlay" class="fullscreen-overlay">
        <span class="close-button" onclick="closeFullscreenView()">&times;</span>
        <img id="fullscreen-image" class="fullscreen-image" src="" alt="">
    </div>

    <div id="photo-lightbox" class="photo-lightbox" onclick="closeLightbox(event)">
        <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
        <button class="lightbox-arrow prev" onclick="lightboxNav(-1, event)">&#8249;</button>
        <img id="lightbox-img" class="lightbox-img" src="" alt="">
        <button class="lightbox-arrow next" onclick="lightboxNav(1, event)">&#8250;</button>
        <div id="lightbox-counter" class="lightbox-counter"></div>
    </div>

    <script>
        const artworks = {
            "ts-v-ye": { name: "Taylor Swift v Ye", year: "2025", medium: "Mixed Media on canvas Paper", size: "105cm x 198cm", description: "A colorful and explosive portrayal of two controversial figures.", price: "PRICE ON REQUEST" },
            "wonderful-again": { name: "Make America Wonderful Again", year: "2025", medium: "Mixed Media on Paper", size: "35.5cm x 27.7cm", description: "What America thinks of itself.", price: "PRICE ON REQUEST" },
            "damaged": { name: "Damaged", year: "2025", medium: "Mixed Media on Cotton Board", size: "50cm x 50cm", description: "An abstract display of Trump and his 'damaged' mind.", price: "PRICE ON REQUEST" },
            "batman-kills": { name: "BATMAN KILLS", year: "2025", medium: "Mixed Media on Cotton Board", size: "147mm x 66mm", description: "Depiction of an Emirati banknote with a controversial opinion about the Dark Knight.", price: "PRICE ON REQUEST" },
            "itaped": { name: "iTaped", year: "2025", medium: "Colored Pencil on Cotton Board", size: "50cm x 50cm", description: "A experimental Version of the famous Comedian with a Twist that remembers Apple's innovative and long lost \"i\"", price: "PRICE ON REQUEST" },
            "kal-el-no": { name: "KAL EL NO", year: "2025", medium: "Mixed Media on canvas Paper", size: "20cm x 20cm", description: "Gal Gadots Famous and terrible line in Zack Snyders Justice League painted with political flair", price: "PRICE ON REQUEST" },
            "free-will-and-capitalism": { name: "FREE WILL AND CAPITALISM", year: "2025", medium: "Mixed Media on Paper", size: "50cm x 50cm", description: "Walmart and its sudden state of being a playground for Viral Social Media Content", price: "PRICE ON REQUEST" },
            "air-before-2016": { name: "AIR BEFORE 2016", year: "2025", medium: "Mixed Media on Canvas", size: "N/A", description: "Unique Air of a Time without Division, Minimalism and Mediocrity", price: "PRICE ON REQUEST" }
        };

        const imageSources = {
            "ts-v-ye": { gallery: "https://i.imgur.com/BvtFNyO.jpeg", detail: "https://i.imgur.com/XmvfLin.jpeg" },
            "wonderful-again": { gallery: "https://i.imgur.com/6zSXpMF.jpeg", detail: "https://i.imgur.com/ko2UzS7.jpeg" },
            "damaged": { gallery: "https://i.imgur.com/hKaHoP5.jpeg", detail: "https://i.imgur.com/kYtaN1d.jpeg" },
            "batman-kills": "https://i.imgur.com/BXoqmYY.png",
            "itaped": { gallery: "https://i.imgur.com/bNlXMcU.png", detail: "https://i.imgur.com/bsQeOpO.jpeg" },
            "kal-el-no": "https://i.imgur.com/xMnAQsl.jpeg",
            "free-will-and-capitalism": { gallery: "https://imgur.com/U6Ev36c.jpg", detail: "https://imgur.com/lu25Guo.jpg" },
            "air-before-2016": { gallery: "https://i.imgur.com/NWn4VAc.jpeg", detail: "https://i.imgur.com/NWn4VAc.jpeg" }
        };

        const photoSeries = [
            {
                id: "kenopsia",
                title: "KENOPSIA",
                photos: {
                    "kenopsia-1": { name: "KENOPSIA #1", year: "2025", location: "", description: "", price: "PRICE ON REQUEST" },
                    "kenopsia-2": { name: "KENOPSIA #2", year: "2025", location: "", description: "", price: "PRICE ON REQUEST" },
                    "kenopsia-3": { name: "KENOPSIA #3", year: "2025", location: "", description: "", price: "PRICE ON REQUEST" },
                    "kenopsia-4": { name: "KENOPSIA #4", year: "2025", location: "", description: "", price: "PRICE ON REQUEST" },
                    "kenopsia-5": { name: "KENOPSIA #5", year: "2025", location: "", description: "", price: "PRICE ON REQUEST" },
                    "kenopsia-6": { name: "KENOPSIA #6", year: "2025", location: "", description: "", price: "PRICE ON REQUEST" }
                },
                sources: {
                    "kenopsia-1": { gallery: "https://i.imgur.com/F7IRHRz.jpg", detail: "https://i.imgur.com/F7IRHRz.jpg" },
                    "kenopsia-2": { gallery: "https://i.imgur.com/fW1M6TT.jpg", detail: "https://i.imgur.com/fW1M6TT.jpg" },
                    "kenopsia-3": { gallery: "https://i.imgur.com/khyjKrn.jpg", detail: "https://i.imgur.com/khyjKrn.jpg" },
                    "kenopsia-4": { gallery: "https://i.imgur.com/EWsLXVJ.jpg", detail: "https://i.imgur.com/EWsLXVJ.jpg" },
                    "kenopsia-5": { gallery: "https://i.imgur.com/VaTioir.jpg", detail: "https://i.imgur.com/VaTioir.jpg" },
                    "kenopsia-6": { gallery: "https://i.imgur.com/CKBJWT4.jpg", detail: "https://i.imgur.com/CKBJWT4.jpg" }
                }
            }
        ];

        const photos = {};
        const photoSources = {};
        photoSeries.forEach(s => { Object.assign(photos, s.photos); Object.assign(photoSources, s.sources); });

        let currentSection = 'art';

        function switchSection(section) {
            currentSection = section;
            document.getElementById('nav-art').className  = 'nav-section ' + (section === 'art'   ? 'active' : 'inactive');
            document.getElementById('nav-photo').className = 'nav-section ' + (section === 'photo' ? 'active' : 'inactive');
            document.getElementById('section-art').style.display   = section === 'art'   ? 'block' : 'none';
            document.getElementById('section-photo').style.display = section === 'photo' ? 'block' : 'none';
            if (section === 'art') {
                document.getElementById('main-gallery').style.display = 'grid';
                document.getElementById('artwork-detail').style.display = 'none';
            } else {
                document.getElementById('photo-gallery-wrapper').style.display = 'block';
                document.getElementById('photo-detail').style.display = 'none';
            }
            history.pushState({ view: 'gallery', section }, '', location.pathname + (section === 'photo' ? '#photography' : ''));
            window.scrollTo(0, 0);
        }

        function createGalleryItems() {
            buildGallery('main-gallery', artworks, imageSources, showArtworkDetail);
            buildPhotoGallery();
        }

        function buildGallery(listId, dataObj, srcObj, clickFn) {
            const galleryList = document.getElementById(listId);
            galleryList.innerHTML = '';
            for (const key of Object.keys(dataObj)) {
                const item = dataObj[key];
                const listItem = document.createElement('li');
                listItem.className = 'artwork-item';
                const imageSrc = (typeof srcObj[key] === 'object' && srcObj[key].gallery) ? srcObj[key].gallery : (srcObj[key] || 'https://placehold.co/500x500/A0A0A0/ffffff?text=Not+Found');
                listItem.innerHTML = `<img src="${imageSrc}" alt="${item.name}" class="artwork-image" onerror="this.onerror=null;this.src='https://placehold.co/500x500/A0A0A0/ffffff?text=Not+Found'"><div class="artwork-title"></div>`;
                listItem.addEventListener('click', () => clickFn(key));
                galleryList.appendChild(listItem);
            }
        }

        function buildPhotoGallery() {
            const wrapper = document.getElementById('photo-gallery-wrapper');
            wrapper.innerHTML = '';
            photoSeries.forEach(series => {
                const heading = document.createElement('h2');
                heading.className = 'series-title';
                heading.textContent = series.title;
                wrapper.appendChild(heading);
                const grid = document.createElement('ul');
                grid.className = 'gallery';
                grid.id = 'photo-gallery-' + series.id;
                for (const key of Object.keys(series.photos)) {
                    const photo = series.photos[key];
                    const src = series.sources[key];
                    const imageSrc = (src && src.gallery) ? src.gallery : 'https://placehold.co/500x500/A0A0A0/ffffff?text=Not+Found';
                    const listItem = document.createElement('li');
                    listItem.className = 'artwork-item';
                    listItem.innerHTML = `<img src="${imageSrc}" alt="${photo.name}" class="artwork-image" onerror="this.onerror=null;this.src='https://placehold.co/500x500/A0A0A0/ffffff?text=Not+Found'"><div class="artwork-title"></div>`;
                    listItem.addEventListener('click', () => openLightbox(key));
                    grid.appendChild(listItem);
                }
                wrapper.appendChild(grid);
            });
        }

        function showArtworkDetail(id) {
            history.pushState({ view: 'detail', section: 'art', id }, '', `#artwork-${id}`);
            const gallery = document.getElementById('main-gallery');
            const detailView = document.getElementById('artwork-detail');
            const artwork = artworks[id];
            if (!artwork) return;
            const imageSrc = (typeof imageSources[id] === 'object' && imageSources[id].detail) ? imageSources[id].detail : (imageSources[id] || 'https://placehold.co/500x500/A0A0A0/ffffff?text=Not+Found');
            detailView.innerHTML = `
                <img src="${imageSrc}" alt="${artwork.name}" class="detail-image ${id === 'itaped' ? 'large-detail itaped-adjust' : ''}" onclick="openFullscreenView('${imageSrc}')" onerror="this.onerror=null;this.src='https://placehold.co/800x600/A0A0A0/ffffff?text=Not+Found'">
                <div class="detail-info"><div>
                    <h2>${artwork.name}</h2>
                    <div style="margin-bottom:1.5rem;font-weight:300;font-style:italic;line-height:1.5;">${artwork.description || ''}</div>
                    <strong>Year:</strong> <span>${artwork.year}</span><br>
                    <strong>Medium:</strong> <span>${artwork.medium}</span><br>
                    <strong>Size:</strong> <span>${artwork.size}</span>
                    <div class="price-line" style="margin-top:0.5rem;font-weight:600;">${artwork.price}</div>
                </div></div>`;
            gallery.style.display = 'none';
            detailView.style.display = 'block';
            window.scrollTo(0, 0);
        }

        function showGallery() {
            if (currentSection === 'art') {
                document.getElementById('main-gallery').style.display = 'grid';
                document.getElementById('artwork-detail').style.display = 'none';
            } else {
                document.getElementById('photo-gallery-wrapper').style.display = 'block';
                document.getElementById('photo-detail').style.display = 'none';
            }
        }

        function openFullscreenView(imageSrc) {
            const overlay = document.getElementById('fullscreen-overlay');
            document.getElementById('fullscreen-image').src = imageSrc;
            overlay.style.display = 'flex';
        }

        function closeFullscreenView() {
            document.getElementById('fullscreen-overlay').style.display = 'none';
        }

        let lightboxPhotos = [];
        let lightboxIndex = 0;

        function openLightbox(photoId) {
            lightboxPhotos = [];
            photoSeries.forEach(series => {
                Object.keys(series.photos).forEach(key => {
                    const src = series.sources[key];
                    lightboxPhotos.push({ id: key, src: (src && src.detail) ? src.detail : src });
                });
            });
            lightboxIndex = lightboxPhotos.findIndex(p => p.id === photoId);
            if (lightboxIndex === -1) lightboxIndex = 0;
            renderLightbox();
            document.getElementById('photo-lightbox').classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function renderLightbox() {
            const item = lightboxPhotos[lightboxIndex];
            document.getElementById('lightbox-img').src = item.src;
            document.getElementById('lightbox-counter').textContent = (lightboxIndex + 1) + ' / ' + lightboxPhotos.length;
        }

        function lightboxNav(dir, event) {
            if (event) event.stopPropagation();
            lightboxIndex = (lightboxIndex + dir + lightboxPhotos.length) % lightboxPhotos.length;
            renderLightbox();
        }

        function closeLightbox(event) {
            if (event && event.target !== document.getElementById('photo-lightbox') && !event.target.classList.contains('lightbox-close')) return;
            document.getElementById('photo-lightbox').classList.remove('open');
            document.body.style.overflow = '';
        }

        document.addEventListener('keydown', (e) => {
            const lb = document.getElementById('photo-lightbox');
            if (!lb.classList.contains('open')) return;
            if (e.key === 'ArrowRight') lightboxNav(1, null);
            if (e.key === 'ArrowLeft') lightboxNav(-1, null);
            if (e.key === 'Escape') { lb.classList.remove('open'); document.body.style.overflow = ''; }
        });

        window.addEventListener('popstate', (event) => {
            const state = event.state;
            if (!state || state.view === 'gallery') { showGallery(); return; }
            if (state.view === 'detail' && state.section === 'art') showArtworkDetail(state.id);
        });

        document.addEventListener('DOMContentLoaded', () => {
            createGalleryItems();
            if (!history.state) history.replaceState({ view: 'gallery', section: 'art' }, '', location.pathname);
            if (location.hash.startsWith('#artwork-')) {
                const id = location.hash.replace('#artwork-', '');
                if (artworks[id]) showArtworkDetail(id);
            } else if (location.hash === '#photography') {
                switchSection('photo');
            } else {
                showGallery();
            }
        });
    </script>
</body>
</html>
