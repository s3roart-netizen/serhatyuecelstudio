    <style>
       
        @font-face {
            font-family: 'Apple Garamond';
            src: url('SYS/fonts/AppleGaramond.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Apple Garamond';
            src: url('SYS/fonts/AppleGaramond.ttf') format('truetype');
            font-weight: 400;
            font-style: italic;
            font-display: swap;
        }

        @font-face {
            font-family: 'Apple Garamond';
            src: url('SYS/fonts/AppleGaramond.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --primary-color: #333;
            --background-color: #ffffff;
            --light-grey: #e0e0e0;
            --black-overlay: rgba(0, 0, 0, 0.7);
            --nav-active: #111111;
            --nav-inactive: #b0b0b0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--background-color);
            color: var(--primary-color);
            margin: 0;
            padding: 0rem 1rem;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ─── HEADER ─────────────────────────────────────────────── */
        header {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding: 0rem 1rem;
            margin-bottom: 0;
            gap: 2rem;
        }

        /* Each nav section: logo + label side by side */
        .nav-section {
            display: flex;
            align-items: flex-end;
            gap: 0;
            text-decoration: none;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .nav-section:hover {
            opacity: 0.75;
        }

        .nav-logo {
            height: 80px;
            width: auto;
            object-fit: contain;
            display: block;
            margin-top: 12px;
            transition: filter 0.25s ease, opacity 0.25s ease;
        }

        .nav-label {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0;
            white-space: nowrap;
            transition: color 0.25s ease;
            margin-bottom: 10px;
            margin-left: -18px;
        }

        /* Active state: black */
        .nav-section.active .nav-logo {
            filter: none;
            opacity: 1;
        }
        .nav-section.active .nav-label {
            color: var(--nav-active);
        }

        /* Inactive state: greyed out */
        .nav-section.inactive .nav-logo {
            filter: grayscale(100%) opacity(0.35);
        }
        .nav-section.inactive .nav-label {
            color: var(--nav-inactive);
        }

        /* ─── GALLERY ─────────────────────────────────────────────── */
        .gallery-container {
            max-width: 1200px;
            margin: 3rem auto 0;
            padding: 0 1rem 0rem;
            flex-grow: 1;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            list-style: none;
            padding: 0;
            margin: 0;
            justify-content: center;
        }

        .artwork-item {
            position: relative;
            background: transparent;
            border-radius: 0;
            overflow: hidden;
            box-shadow: none;
            transition: transform 0.3s ease;
            text-align: center;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            aspect-ratio: 1 / 1;
            box-sizing: border-box;
            padding: 12px;
            justify-content: center;
        }
        
        .artwork-item:hover {
            transform: translateY(-5px);
            box-shadow: none;
        }

        .artwork-item a {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .artwork-image {
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
        }

        .artwork-title {
            display: none;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial;
            font-weight: 600;
            font-size: 1.2rem;
            padding: 1rem 0;
            user-select: none;
            width: 100%;
        }

        /* ─── DETAIL VIEW ─────────────────────────────────────────── */
        .artwork-detail {
            display: none;
            padding: 0;
            background-color: transparent;
            border-radius: 0;
            max-width: 640px;
            margin: 0 auto;
            box-shadow: none;
        }

        .detail-image {
            width: 100%;
            height: auto;
            max-width: 560px;
            max-height: 60vh;
            object-fit: contain;
            margin: 0 auto 0;
            display: block;
            cursor: pointer;
        }

        .detail-image.large-detail {
            max-width: 1000px;
            max-height: 85vh;
        }
          
        .detail-image.itaped-adjust {
            margin-top: -40px;
        }

        .detail-info {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.5rem;
            font-weight: 300;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
            margin-top: 0.25rem;
        }

        .detail-info h2 {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 1.5rem;
            font-weight: 600;
            margin-top: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .detail-info strong {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial;
            font-weight: 600;
        }

        .detail-info span,
        .price-line {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
        
        /* ─── FULLSCREEN ──────────────────────────────────────────── */
        .fullscreen-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
        }

        .fullscreen-image {
            max-width: 90%;
            max-height: 90vh;
            object-fit: contain;
            cursor: pointer;
        }

        .close-button {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 2rem;
            color: #fff;
            cursor: pointer;
            user-select: none;
        }

        /* ─── FOOTER ──────────────────────────────────────────────── */
        footer {
            margin-top: 3rem;
            padding: 2rem 1rem 1rem;
            text-align: center;
        }

        .series-title {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--nav-active);
            letter-spacing: 0.04em;
            margin: 0 0 1.5rem 0;
            padding: 0;
        }

        .tiktok-link-image {
            width: 30px;
            height: auto;
            object-fit: contain;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .tiktok-link-image:hover {
            opacity: 0.9;
            transform: scale(1.05);
        }
        
        /* ─── RESPONSIVE ──────────────────────────────────────────── */
        @media (max-width: 768px) {
            .gallery {
                grid-template-columns: 1fr;
            }
            .detail-info {
                grid-template-columns: 1fr;
            }
            header {
                gap: 1rem;
            }
        }

        @media (min-width: 1024px) {
            .gallery {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .logo-text {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial;
        }

        h1.logo-text {
          margin: 0;
        }

        /* ─── PHOTO LIGHTBOX ──────────────────────────────────────── */
        .photo-lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.93);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .photo-lightbox.open {
            display: flex;
        }

        .lightbox-img {
            max-width: 85vw;
            max-height: 85vh;
            object-fit: contain;
            user-select: none;
            pointer-events: none;
        }

        .lightbox-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #fff;
            font-size: 2.5rem;
            cursor: pointer;
            padding: 1rem;
            opacity: 0.6;
            transition: opacity 0.2s ease;
            user-select: none;
            line-height: 1;
        }

        .lightbox-arrow:hover { opacity: 1; }
        .lightbox-arrow.prev { left: 1rem; }
        .lightbox-arrow.next { right: 1rem; }

        .lightbox-close {
            position: absolute;
            top: 1.2rem; right: 1.5rem;
            font-size: 2rem;
            color: #fff;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.2s ease;
            user-select: none;
        }
        .lightbox-close:hover { opacity: 1; }

        .lightbox-counter {
            position: absolute;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 0.8rem;
            opacity: 0.5;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
            letter-spacing: 0.1em;
        }
    </style>
</head>
<body>

    <header>
        <!-- Traditional Art nav section -->
        <div class="nav-section active" id="nav-art" onclick="switchSection('art')">
            <img src="https://imgur.com/zslzw0O.jpg" 
                 alt="Serhat Yuecel Logo"

    <!-- ─── TRADITIONAL ART SECTION ─────────────────────────────── -->

    <script>
        // ─── TRADITIONAL ART DATA ────────────────────────────────────
        const artworks = {
            "ts-v-ye": {

            },
            "kal-el-no": {
                name: "KAL EL NO",
                year: "2025",
                medium: "Mixed Media on canvas Paper",
                description: "Gal Gadots Famous and terrible line in Zack Snyders Justice League painted with political flair",
                size: "20cm x 20cm",
                price: "PRICE ON REQUEST"
            },
            "free-will-and-capitalism": {
                name: "FREE WILL AND CAPITALISM",
                year: "2025",
                medium: "Mixed Media on Paper",
                size: "50cm x 50cm",
                description: "Walmart and its sudden state of being a playground for Viral Social Media Content",
                price: "PRICE ON REQUEST"
            },
            "air-before-2016": {
                name: "AIR BEFORE 2016",
                year: "2025",
                medium: "Mixed Media on Canvas",
                size: "N/A",
                description: "Unique Air of a Time without Division, Minimalism and Mediocrity",
                price: "PRICE ON REQUEST"
            }
        };

        const imageSources = {
            "ts-v-ye": {
                gallery: "https://i.imgur.com/BvtFNyO.jpeg",
                detail: "https://i.imgur.com/XmvfLin.jpeg"
            },
            "wonderful-again": {
                gallery: "https://i.imgur.com/6zSXpMF.jpeg",
                detail: "https://i.imgur.com/ko2UzS7.jpeg"
            },
            "damaged": {
                gallery: "https://i.imgur.com/hKaHoP5.jpeg",
                detail: "https://i.imgur.com/kYtaN1d.jpeg"
            },
            "batman-kills": "https://i.imgur.com/BXoqmYY.png",
            "itaped": {
                gallery: "https://i.imgur.com/bNlXMcU.png",
                detail: "https://i.imgur.com/bsQeOpO.jpeg"
            },
            "kal-el-no": "https://i.imgur.com/xMnAQsl.jpeg",
            "free-will-and-capitalism": {
                gallery: "https://imgur.com/U6Ev36c.jpg",
                detail: "https://imgur.com/lu25Guo.jpg"
            },
            "air-before-2016": {
                gallery: "https://i.imgur.com/NWn4VAc.jpeg",
                detail: "https://i.imgur.com/NWn4VAc.jpeg"
            }
        };

        // ─── PHOTOGRAPHY DATA ────────────────────────────────────────
        // Each series: id, title, photos object, sources object.
        // To add real images: replace placehold.co URLs with your Imgur links.
        const photoSeries = [
            {
                id: "kenopsia",
                title: "KENOPSIA",
                photos: {
                    "kenopsia-1": { name: "KENOPSIA #1", year: "2025", location: "", description: "", price: "PRICE ON REQUEST" },
                    "kenopsia-2": { name: "KENOPSIA #2", year: "2025", location: "", description: "", price: "PRICE ON REQUEST" },
                    "kenopsia-3": { name: "KENOPSIA #3", year: "2025", location: "", description: "", price: "PRICE ON REQUEST" },
                    "kenopsia-4": { name: "KENOPSIA #4", year: "2025", location: "", description: "", price: "PRICE ON REQUEST" },
                    "kenopsia-5": { name: "KENOPSIA #5", year: "2025", location: "", description: "", price: "PRICE ON REQUEST" },
                    "kenopsia-6": { name: "KENOPSIA #6", year: "2025", location: "", description: "", price: "PRICE ON REQUEST" }
                },
                sources: {
                    "kenopsia-1": { gallery: "https://i.imgur.com/F7IRHRz.jpg", detail: "https://i.imgur.com/F7IRHRz.jpg" },
                    "kenopsia-2": { gallery: "https://i.imgur.com/fW1M6TT.jpg", detail: "https://i.imgur.com/fW1M6TT.jpg" },
                    "kenopsia-3": { gallery: "https://i.imgur.com/khyjKrn.jpg", detail: "https://i.imgur.com/khyjKrn.jpg" },
                    "kenopsia-4": { gallery: "https://i.imgur.com/EWsLXVJ.jpg", detail: "https://i.imgur.com/EWsLXVJ.jpg" },
                    "kenopsia-5": { gallery: "https://i.imgur.com/VaTioir.jpg", detail: "https://i.imgur.com/VaTioir.jpg" },
                    "kenopsia-6": { gallery: "https://i.imgur.com/CKBJWT4.jpg", detail: "https://i.imgur.com/CKBJWT4.jpg" }
                }
            }
            // Add more series here following the same pattern
        ];

        // Flat lookup maps built from series (used by detail view)
        const photos = {};
        const photoSources = {};
        photoSeries.forEach(s => {
            Object.assign(photos, s.photos);
            Object.assign(photoSources, s.sources);
        });

        // ─── CURRENT STATE ───────────────────────────────────────────
        let currentSection = 'art'; // 'art' or 'photo'

        // ─── SECTION SWITCHING ───────────────────────────────────────
        function switchSection(section) {
            currentSection = section;

            // Update nav states
            document.getElementById('nav-art').className  = 'nav-section ' + (section === 'art'   ? 'active' : 'inactive');
            document.getElementById('nav-photo').className = 'nav-section ' + (section === 'photo' ? 'active' : 'inactive');

            // Show/hide sections
            document.getElementById('section-art').style.display   = section === 'art'   ? 'block' : 'none';
            document.getElementById('section-photo').style.display = section === 'photo' ? 'block' : 'none';

            // Always reset to gallery view when switching
            if (section === 'art') {
                document.getElementById('main-gallery').style.display = 'grid';
                document.getElementById('artwork-detail').style.display = 'none';
            } else {
                document.getElementById('photo-gallery-wrapper').style.display = 'block';
                document.getElementById('photo-detail').style.display = 'none';
            }

            history.pushState({ view: 'gallery', section }, '', location.pathname + (section === 'photo' ? '#photography' : ''));
            window.scrollTo(0, 0);
        }

        // ─── BUILD GALLERY ───────────────────────────────────────────
        function createGalleryItems() {
            buildGallery('main-gallery', artworks, imageSources, showArtworkDetail);
            buildPhotoGallery();
        }

        function buildGallery(listId, dataObj, srcObj, clickFn) {
            const galleryList = document.getElementById(listId);
            galleryList.innerHTML = '';

            for (const key of Object.keys(dataObj)) {
                const item = dataObj[key];
                const listItem = document.createElement('li');
                listItem.className = 'artwork-item';
                listItem.setAttribute('data-id', key);

                const imageSrc = (typeof srcObj[key] === 'object' && srcObj[key].gallery)
                                 ? srcObj[key].gallery
                                 : (srcObj[key] || 'https://placehold.co/500x500/A0A0A0/ffffff?text=Image+Not+Found');

                listItem.innerHTML = `
                    <img src="${imageSrc}" alt="${item.name}" class="artwork-image" onerror="this.onerror=null;this.src='https://placehold.co/500x500/A0A0A0/ffffff?text=Image+Not+Found'">
                    <div class="artwork-title"></div>
                `;

                listItem.addEventListener('click', () => clickFn(key));
                galleryList.appendChild(listItem);
            }
        }

        function buildPhotoGallery() {
            const wrapper = document.getElementById('photo-gallery-wrapper');
            wrapper.innerHTML = '';

            photoSeries.forEach(series => {
                // Series title heading
                const heading = document.createElement('h2');
                heading.className = 'series-title';
                heading.textContent = series.title;
                wrapper.appendChild(heading);

                // Grid for this series
                const grid = document.createElement('ul');
                grid.className = 'gallery';
                grid.id = 'photo-gallery-' + series.id;

                for (const key of Object.keys(series.photos)) {
                    const photo = series.photos[key];
                    const src = series.sources[key];
                    const imageSrc = (src && src.gallery) ? src.gallery : 'https://placehold.co/500x500/A0A0A0/ffffff?text=Image+Not+Found';

                    const listItem = document.createElement('li');
                    listItem.className = 'artwork-item';
                    listItem.setAttribute('data-id', key);
                    listItem.innerHTML = `
                        <img src="${imageSrc}" alt="${photo.name}" class="artwork-image" onerror="this.onerror=null;this.src='https://placehold.co/500x500/A0A0A0/ffffff?text=Image+Not+Found'">
                        <div class="artwork-title"></div>
                    `;
                    listItem.addEventListener('click', () => openLightbox(key));
                    grid.appendChild(listItem);
                }

                wrapper.appendChild(grid);
            });
        }

        // ─── ART DETAIL ──────────────────────────────────────────────
        function showArtworkDetail(id) {
            history.pushState({ view: 'detail', section: 'art', id }, '', `#artwork-${id}`);

            const gallery    = document.getElementById('main-gallery');
            const detailView = document.getElementById('artwork-detail');
            const artwork    = artworks[id];
            if (!artwork) return;

            const imageSrc = (typeof imageSources[id] === 'object' && imageSources[id].detail)
                             ? imageSources[id].detail
                             : (imageSources[id] || 'https://placehold.co/500x500/A0A0A0/ffffff?text=Image+Not+Found');

            detailView.innerHTML = `
                <img src="${imageSrc}" alt="${artwork.name}" class="detail-image ${id === 'itaped' ? 'large-detail itaped-adjust' : ''}" onclick="openFullscreenView('${imageSrc}')" onerror="this.onerror=null;this.src='https://placehold.co/800x600/A0A0A0/ffffff?text=Image+Not+Found'">
                <div class="detail-info">
                    <div>
                        <h2>${artwork.name}</h2>
                        <div style="margin-bottom: 1.5rem; font-weight: 300; font-style: italic; line-height: 1.5;">${artwork.description || ''}</div>
                        <strong>Year:</strong> <span>${artwork.year}</span><br>
                        <strong>Medium:</strong> <span>${artwork.medium}</span><br>
                        <strong>Size:</strong> <span>${artwork.size}</span>
                        <div class="price-line" style="margin-top: 0.5rem; font-weight: 600; color: var(--primary-color);">${artwork.price}</div>
                    </div>
                    <div></div>
                </div>
            `;

            gallery.style.display = 'none';
            detailView.style.display = 'block';
            window.scrollTo(0, 0);
        }

        // ─── PHOTO DETAIL ─────────────────────────────────────────────
        function showPhotoDetail(id) {
            history.pushState({ view: 'detail', section: 'photo', id }, '', `#photo-${id}`);

            const gallery    = document.getElementById('photo-gallery');
            const detailView = document.getElementById('photo-detail');
            const photo      = photos[id];
            if (!photo) return;

            const imageSrc = (typeof photoSources[id] === 'object' && photoSources[id].detail)
                             ? photoSources[id].detail
                             : (photoSources[id] || 'https://placehold.co/500x500/A0A0A0/ffffff?text=Image+Not+Found');

            detailView.innerHTML = `
                <img src="${imageSrc}" alt="${photo.name}" class="detail-image" onclick="openFullscreenView('${imageSrc}')" onerror="this.onerror=null;this.src='https://placehold.co/800x600/A0A0A0/ffffff?text=Image+Not+Found'">
                <div class="detail-info">
                    <div>
                        <h2>${photo.name}</h2>
                        <div style="margin-bottom: 1.5rem; font-weight: 300; font-style: italic; line-height: 1.5;">${photo.description || ''}</div>
                        <strong>Year:</strong> <span>${photo.year}</span><br>
                        ${photo.location ? `<strong>Location:</strong> <span>${photo.location}</span><br>` : ''}
                        <div class="price-line" style="margin-top: 0.5rem; font-weight: 600; color: var(--primary-color);">${photo.price}</div>
                    </div>
                    <div></div>
                </div>
            `;

            gallery.style.display = 'none';
            detailView.style.display = 'block';
            window.scrollTo(0, 0);
        }

        // ─── SHOW GALLERY (back button / logo click) ──────────────────
        function showGallery() {
            if (currentSection === 'art') {
                document.getElementById('main-gallery').style.display = 'grid';
                document.getElementById('artwork-detail').style.display = 'none';
            } else {
                document.getElementById('photo-gallery-wrapper').style.display = 'block';
                document.getElementById('photo-detail').style.display = 'none';
            }
        }

        // ─── FULLSCREEN ───────────────────────────────────────────────
        function openFullscreenView(imageSrc) {
            const overlay = document.getElementById('fullscreen-overlay');
            const image   = document.getElementById('fullscreen-image');
            image.src = imageSrc;
            overlay.style.display = 'flex';
        }

        function closeFullscreenView() {
            document.getElementById('fullscreen-overlay').style.display = 'none';
        }

        // ─── BROWSER NAVIGATION ───────────────────────────────────────
        window.addEventListener('popstate', (event) => {
            const state = event.state;
            if (!state || state.view === 'gallery') {
                showGallery();
                return;
            }
            if (state.view === 'detail') {
                if (state.section === 'photo') showPhotoDetail(state.id);
                else showArtworkDetail(state.id);
            }
        });

        // ─── INIT ─────────────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', () => {
            createGalleryItems();

            if (!history.state) {
                history.replaceState({ view: 'gallery', section: 'art' }, '', location.pathname);
            }

            // Deep link support
            if (location.hash.startsWith('#artwork-')) {
                const id = location.hash.replace('#artwork-', '');
                if (artworks[id]) showArtworkDetail(id);
            } else if (location.hash.startsWith('#photo-')) {
                const id = location.hash.replace('#photo-', '');
                switchSection('photo');
                if (photos[id]) showPhotoDetail(id);
            } else if (location.hash === '#photography') {
                switchSection('photo');
            } else {
                showGallery();
            }
        });
    </script>

    <!-- Photo Lightbox -->
    <div id="photo-lightbox" class="photo-lightbox" onclick="closeLightbox(event)">
        <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
        <button class="lightbox-arrow prev" onclick="lightboxNav(-1, event)">&#8249;</button>
        <img id="lightbox-img" class="lightbox-img" src="" alt="">
        <button class="lightbox-arrow next" onclick="lightboxNav(1, event)">&#8250;</button>
        <div id="lightbox-counter" class="lightbox-counter"></div>
    </div>
</body>
</html>
